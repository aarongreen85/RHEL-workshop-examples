---
- name: Inspect firewalld zones - RHEL-08-040030
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: List all firewalld zones
      ansible.builtin.command:
        cmd: firewall-cmd --list-all-zones
      register: firewall_zones
      changed_when: false

    - name: Display active and services lines
      ansible.builtin.debug:
        msg: "{{ firewall_zones.stdout_lines
                 | select('search', 'active|services')
                 | list }}"

- name: Check firewalld status and zone configuration - RHEL-08-040090
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Check firewalld state
      ansible.builtin.command:
        cmd: firewall-cmd --state
      register: firewalld_state
      changed_when: false

    - name: Display firewalld state
      ansible.builtin.debug:
        var: firewalld_state.stdout

    - name: Get active firewalld zones
      ansible.builtin.command:
        cmd: firewall-cmd --get-active-zones
      register: active_zones
      changed_when: false

    - name: Display active zones
      ansible.builtin.debug:
        var: active_zones.stdout_lines

    - name: Get custom zone configuration
      ansible.builtin.command:
        cmd: firewall-cmd --info-zone=public
      register: public_zone
      changed_when: false

    - name: Display custom zone target
      ansible.builtin.debug:
        var: public_zone.stdout_lines
